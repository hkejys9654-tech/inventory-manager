<style>
:root{--bg:#f5f7fa;--card:#fff;--line:#e2e8f0;--line2:#cbd5e1;--text:#0f172a;--sub:#64748b;--blue:#1d64c4;--blue-soft:#e8f1fd;--orange:#f07000;--orange-soft:#fff2e5;--green:#0f9d58;--green-soft:#e6f6ee;--red:#dc3545;--red-soft:#fdeaec;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:16px}button,input,select{font-family:inherit}
.topbar{background:var(--card);border-bottom:3px solid var(--blue);padding:20px 18px 0;position:sticky;top:0;z-index:50}.brandline{display:flex;align-items:center;gap:10px}.brandline .mark{width:44px;height:44px;border-radius:12px;background:var(--blue);display:flex;align-items:center;justify-content:center;overflow:hidden}.brandline .mark img{width:100%;height:100%;display:block}.installbtn{margin-left:auto;padding:9px 12px;border:2px solid var(--blue);border-radius:12px;background:var(--blue-soft);color:var(--blue);font-size:12px;font-weight:800}.installbtn[hidden]{display:none}h1{margin:0;font-size:24px;font-weight:900;letter-spacing:-.02em}.datesub{font-size:13px;color:var(--sub);margin-top:2px}.tabs{display:flex;gap:4px;margin-top:16px}.tabs button{flex:1;padding:14px 4px;font-size:15px;font-weight:700;background:none;border:none;color:var(--sub);border-bottom:4px solid transparent}.tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
.summary{display:flex;gap:10px;padding:16px 14px 4px;max-width:680px;margin:0 auto}.sbox{flex:1;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center}.sbox .n{font-family:var(--mono);font-size:28px;font-weight:800;line-height:1}.sbox .l{font-size:12px;color:var(--sub);margin-top:6px;font-weight:500}.sbox.red{border-color:#f8b4bc;background:var(--red-soft)}.sbox.red .n{color:var(--red)}.sbox.orange{border-color:#fcd0a8;background:var(--orange-soft)}.sbox.orange .n{color:var(--orange)}.sbox.green{border-color:#a8e0c4;background:var(--green-soft)}.sbox.green .n{color:var(--green)}
main{max-width:680px;margin:0 auto;padding:8px 14px 120px}.page{display:none}.page.on{display:block}.cat{background:var(--card);border:2px solid var(--line);border-radius:18px;margin-bottom:14px;overflow:hidden}.cathead{width:100%;display:flex;align-items:center;justify-content:space-between;padding:18px 16px;background:none;border:none;text-align:left}.cathead .left{display:flex;align-items:center;gap:10px}.cathead .badge{background:var(--blue-soft);color:var(--blue);font-size:12px;font-weight:800;padding:5px 10px;border-radius:8px;font-family:var(--mono)}.cathead .nm{font-size:19px;font-weight:800}.cathead .arw{font-size:15px;color:var(--sub);transition:transform .2s}.cat.open .cathead .arw{transform:rotate(180deg)}.catbody{display:none;border-top:2px solid var(--line)}.cat.open .catbody{display:block}
.row{padding:14px 16px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:none}.rowtop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}.rowtop .itemname{font-size:16px;font-weight:600;line-height:1.35;flex:1}.pill{font-size:11px;font-weight:800;padding:5px 9px;border-radius:20px;white-space:nowrap}.pill.red{background:var(--red-soft);color:var(--red)}.pill.orange{background:var(--orange-soft);color:var(--orange)}.pill.green{background:var(--green-soft);color:var(--green)}.stepper{display:flex;align-items:center;gap:10px}.stepper button.pm{width:56px;height:56px;border-radius:14px;border:2px solid var(--line2);background:var(--card);font-size:26px;font-weight:800;color:var(--text)}.stepper button.pm.minus:active{background:var(--red-soft);border-color:var(--red);color:var(--red)}.stepper button.pm.plus:active{background:var(--green-soft);border-color:var(--green);color:var(--green)}.stepper input.qty{flex:1;min-width:0;height:56px;text-align:center;font-family:var(--mono);font-size:26px;font-weight:800;border:2px solid var(--line2);border-radius:14px;background:#fbfcfe;color:var(--text)}.stepper input.qty:focus{outline:none;border-color:var(--blue);background:var(--blue-soft)}.rowtools{display:flex;gap:8px;margin-top:10px}.rowtools button{flex:1;padding:11px;font-size:13px;font-weight:700;border-radius:11px;border:2px solid var(--line);background:#fafbfc;color:var(--sub)}.noteedit{display:flex;gap:8px;margin-top:8px}.noteedit input{flex:1;min-width:0;height:44px;padding:0 12px;border:2px solid var(--line);border-radius:11px;background:#fbfcfe;color:var(--text);font-size:14px}.noteedit input:focus{outline:none;border-color:var(--blue)}.noteedit button{height:44px;padding:0 14px;border:2px solid var(--blue);border-radius:11px;background:var(--blue-soft);color:var(--blue);font-size:13px;font-weight:800;white-space:nowrap}.note{font-size:12px;color:var(--sub);margin-top:4px}
.formcard{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}.formcard h3{margin:0 0 16px;font-size:18px;font-weight:800}.fld{margin-bottom:16px}.fld label{display:block;font-size:14px;font-weight:700;color:var(--sub);margin-bottom:8px}select,input.txt{width:100%;height:58px;padding:0 14px;font-size:17px;border:2px solid var(--line2);border-radius:14px;background:#fbfcfe;color:var(--text)}select:focus,input.txt:focus{outline:none;border-color:var(--blue)}.bigtoggle{display:flex;gap:10px;margin-bottom:18px}.bigtoggle button{flex:1;padding:20px 8px;border-radius:16px;border:3px solid var(--line);background:#fafbfc;color:var(--sub);font-size:18px;font-weight:800}.bigtoggle button.on.in{background:var(--green-soft);border-color:var(--green);color:var(--green)}.bigtoggle button.on.out{background:var(--red-soft);border-color:var(--red);color:var(--red)}.bigbtn{width:100%;height:62px;border:none;border-radius:16px;background:var(--blue);color:#fff;font-size:19px;font-weight:900}.bigbtn:active{opacity:.85}.bigbtn.sec{background:var(--card);color:var(--blue);border:2px solid var(--blue)}.bigbtn.warn{background:var(--card);color:var(--red);border:2px solid var(--red)}
.log{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}.log .t1{font-size:15px;font-weight:600}.log .t2{font-size:12px;color:var(--sub);margin-top:3px}.log .amt{font-family:var(--mono);font-size:20px;font-weight:800}.log .amt.in{color:var(--green)}.log .amt.out{color:var(--red)}.log .undo{border:2px solid var(--line);background:#fafbfc;color:var(--sub);border-radius:11px;padding:10px 12px;font-size:13px;font-weight:700}.empty{text-align:center;color:var(--sub);padding:40px 20px;font-size:15px;background:var(--card);border:2px dashed var(--line2);border-radius:18px}
.bottombar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:2px solid var(--line);padding:12px 12px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;max-width:680px;margin:0 auto}.bottombar button{flex:1;height:56px;border-radius:14px;border:2px solid var(--line);background:#fafbfc;font-size:13.5px;font-weight:800;color:var(--text)}.bottombar button.main{background:var(--orange);border-color:var(--orange);color:#fff}.bottombar button.alt{background:var(--blue);border-color:var(--blue);color:#fff}.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:14px 24px;border-radius:30px;font-size:15px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;z-index:100}.toast.show{opacity:1}.hint{font-size:13.5px;color:#1a4d8f;line-height:1.65;background:var(--blue-soft);border-radius:14px;padding:14px 16px;margin-bottom:16px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.75);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}.modal.on{display:flex}.modalbox{background:#fff;border-radius:18px;width:100%;max-width:620px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}.modalhead{padding:16px 18px;border-bottom:2px solid var(--line);font-size:17px;font-weight:800}.modalbody{overflow:auto;padding:12px;background:#eef2f6}.modalbody img{width:100%;display:block;border:1px solid var(--line2);background:#fff}.modalfoot{padding:12px;display:flex;gap:8px;border-top:2px solid var(--line)}.modalfoot button{flex:1;height:54px;border-radius:14px;font-size:15px;font-weight:800;border:2px solid var(--line);background:#fafbfc;color:var(--text)}.modalfoot button.main{background:var(--blue);border-color:var(--blue);color:#fff}
@media(max-width:390px){.topbar{padding-left:12px;padding-right:12px}.tabs button{font-size:13px}.summary{gap:6px;padding-left:10px;padding-right:10px}.sbox{padding-left:4px;padding-right:4px}.sbox .n{font-size:24px}.bottombar button{font-size:12px}}
</style>
<style>
.tabs button{font-size:13.5px}.dategrid{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:8px}.datepart label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin:0 0 6px 2px}.datepart select{height:52px;padding:0 8px;font-size:15px}.reportfilter{padding-bottom:16px}.reportactions{display:flex;gap:8px;margin-top:16px}.reportactions button{flex:1;height:50px;border-radius:13px;border:2px solid var(--blue);background:var(--blue-soft);color:var(--blue);font-size:14px;font-weight:800}.reportactions button.excel{background:var(--orange-soft);border-color:var(--orange);color:var(--orange)}.scope-title{font-size:15px;font-weight:800;color:var(--text);margin:4px 2px 12px}.monthstats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}.mstat{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;text-align:center}.mstat .mv{font-family:var(--mono);font-size:22px;font-weight:800}.mstat .ml{font-size:12px;color:var(--sub);margin-top:3px}.mstat.in .mv{color:var(--green)}.mstat.out .mv{color:var(--red)}.monthgroup{margin-bottom:16px}.monthday{position:sticky;top:142px;z-index:4;background:var(--bg);padding:8px 4px;font-size:15px;font-weight:900;color:var(--blue)}.log-period-day[hidden]{display:none}.formcard .dategrid+.hint{margin-top:12px}.report-note{font-size:12px;color:var(--sub);line-height:1.55;margin-top:10px}
.savehint{padding:11px 14px;background:#fff;color:var(--sub);border-top:1px solid var(--line);font-size:12px;line-height:1.6;white-space:pre-line}.modalfoot.three button{font-size:12.5px;padding:0 5px}.modalfoot button.download{color:var(--blue);border-color:var(--blue);background:var(--blue-soft)}
.bottombar{display:none}main{padding-bottom:36px}.dashpanel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}.dashhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.dashhead h2{margin:0;font-size:18px;font-weight:900}.dashhead .period{font-size:12px;color:var(--blue);font-weight:800}.dashactions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}.dashactions button{min-height:48px;border-radius:13px;border:2px solid var(--line);background:#fafbfc;color:var(--text);font-size:12.5px;font-weight:800}.dashactions button.blue{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}.dashactions button.orange{border-color:var(--orange);background:var(--orange-soft);color:var(--orange)}#page-stock .mstat{cursor:pointer}.dashitem{width:100%;display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:10px;padding:13px 14px;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left;color:var(--text)}.dashitem:last-child{border-bottom:0}.dashitem .dn{font-size:15px;font-weight:600}.dashitem .dnote{display:block;font-size:11px;color:var(--sub);margin-top:3px}.dashitem .dq{font-family:var(--mono);font-size:19px;font-weight:800}.dashitem .go{color:var(--blue);font-weight:900}.dashboard-list .cat{margin-bottom:10px}.edit-intro{font-size:13px;color:var(--sub);line-height:1.6;margin:-4px 0 14px}.editcat{border:2px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}.editcat h4{margin:0;padding:12px 14px;background:var(--blue-soft);color:var(--blue);font-size:15px}.editrow{padding:14px;border-top:1px solid var(--line);scroll-margin-top:150px}.editrow.flash{outline:3px solid var(--orange);outline-offset:-3px;background:var(--orange-soft)}
@media(max-width:390px){.tabs button{font-size:11.5px;padding-left:1px;padding-right:1px}.dategrid{gap:5px}.datepart select{font-size:14px}.reportactions button{font-size:13px}}
</style>
</head>
<body>
<div class="topbar"><div class="brandline"><div class="mark"><img src="icon-192.png" alt=""></div><div><h1>재고관리</h1><div class="datesub" id="dateSub">—</div></div><button class="installbtn" id="btnInstall" hidden>📲 홈화면 설치</button></div><div class="tabs"><button class="on" data-page="stock">홈</button><button data-page="io">입출고</button><button data-page="log">기록</button><button data-page="edit">품목편집</button></div></div>
<div class="summary"><div class="sbox"><div class="n" id="sTotal">0</div><div class="l">전체 품목</div></div><div class="sbox red"><div class="n" id="sRed">0</div><div class="l">부족</div></div><div class="sbox orange"><div class="n" id="sOrange">0</div><div class="l">주의</div></div><div class="sbox green"><div class="n" id="sGreen">0</div><div class="l">충분</div></div></div>
<main>
<div class="page on" id="page-stock"><div class="dashpanel"><div class="dashhead"><h2>이번 달 입출고</h2><span class="period" id="dashMonthLabel"></span></div><div class="monthstats"><div class="mstat in"><div class="mv" id="dashInCount">0</div><div class="ml">입고 건수</div></div><div class="mstat out"><div class="mv" id="dashOutCount">0</div><div class="ml">출고 건수</div></div><div class="mstat in"><div class="mv" id="dashInQty">0</div><div class="ml">입고 수량</div></div><div class="mstat out"><div class="mv" id="dashOutQty">0</div><div class="ml">출고 수량</div></div></div><div class="dashactions"><button class="blue" id="btnHomeImage">🖼 전체 현황</button><button class="orange" id="btnHomeExcel">📊 전체 엑셀</button><button id="btnHomeIO">✏️ 입출고</button></div></div><div class="dashpanel"><div class="dashhead"><h2>현재 재고 현황</h2><span class="period">품목을 누르면 편집으로 이동</span></div><div class="dashboard-list" id="stockList"></div></div></div>
<div class="page" id="page-io"><div class="formcard"><h3>입출고 기록</h3><div class="bigtoggle"><button id="btnIn" class="on in">＋ 입고</button><button id="btnOut">－ 출고</button></div><div class="fld"><label>입출고 일자</label><div class="dategrid"><div class="datepart"><label>연도</label><select id="ioYear"></select></div><div class="datepart"><label>월</label><select id="ioMonth"></select></div><div class="datepart"><label>일</label><select id="ioDay"></select></div></div></div><div class="fld"><label>분류</label><select id="selCat"></select></div><div class="fld"><label>품목</label><select id="selItem"></select></div><div class="fld"><label>수량</label><input class="txt" type="number" id="inpQty" inputmode="numeric" placeholder="0"></div><div class="fld"><label>비고 (선택)</label><input class="txt" type="text" id="inpNote" placeholder="예: OO현장 반입"></div><button class="bigbtn" id="btnSubmit">기록하기</button><div class="reportactions"><button id="btnIoImage">🖼 선택 일자 이미지</button><button class="excel" id="btnIoExcel">📊 선택 일자 엑셀</button></div></div></div>
<div class="page" id="page-log"><div class="formcard reportfilter"><h3>기록 조회 / 출력</h3><div class="fld"><label>조회 단위</label><select id="logPeriod"><option value="day">일자별</option><option value="month">월별</option></select></div><div class="dategrid"><div class="datepart"><label>연도</label><select id="logYear"></select></div><div class="datepart"><label>월</label><select id="logMonth"></select></div><div class="datepart log-period-day"><label>일</label><select id="logDay"></select></div></div><div class="reportactions"><button id="btnLogImage">🖼 선택 기록 이미지</button><button class="excel" id="btnLogExcel">📊 선택 기록 엑셀</button></div></div><div class="scope-title" id="logScopeTitle"></div><div id="logList"></div></div>
<div class="page" id="page-edit"><div class="formcard"><h3>등록 품목 관리</h3><div class="edit-intro">수량·이름·비고를 수정하거나 품목을 삭제할 수 있습니다. 홈에서 품목을 누르면 이 위치로 바로 이동합니다.</div><div id="editInventoryList"></div></div><div class="formcard"><h3>품목 추가</h3><div class="fld"><label>분류 선택</label><select id="addCat"></select></div><div class="fld"><label>품목명</label><input class="txt" type="text" id="addName" placeholder="예: 3W (40홀)"></div><div class="fld"><label>초기 수량</label><input class="txt" type="number" id="addQty" inputmode="numeric" placeholder="0"></div><button class="bigbtn" id="btnAddItem">품목 추가</button></div><div class="formcard"><h3>분류 추가</h3><div class="fld"><label>분류명</label><input class="txt" type="text" id="addCatName" placeholder="예: 볼트류"></div><button class="bigbtn sec" id="btnAddCat">분류 추가</button></div><div class="formcard"><h3>재고 경고 기준</h3><div class="fld"><label>부족 기준 (이 수량 미만이면 빨강)</label><input class="txt" type="number" id="thRed" inputmode="numeric"></div><div class="fld"><label>주의 기준 (이 수량 미만이면 주황)</label><input class="txt" type="number" id="thOrange" inputmode="numeric"></div><button class="bigbtn sec" id="btnSaveTh">기준 저장</button></div><div class="formcard"><h3>초기화</h3><div class="hint" style="margin-bottom:14px">8월 11일 기준 재고값으로 되돌립니다. 추가하신 품목은 삭제되니 유의해 주세요.</div><button class="bigbtn warn" id="btnReset">초기값으로 복원</button></div></div>
</main>
<div class="bottombar"><button class="alt" id="btnImage">🖼 이미지 저장</button><button class="main" id="btnExcel">📊 엑셀 저장</button><button id="btnGoIO">✏️ 입출고</button></div>
<div class="modal" id="imgModal"><div class="modalbox"><div class="modalhead" id="imgModalTitle">재고현황 이미지</div><div class="modalbody"><img id="imgPreview" alt="재고현황 표"></div><div class="savehint" id="imgSaveHint"></div><div class="modalfoot three"><button id="btnImgClose">닫기</button><button class="download" id="btnImgDownload">⬇️ 다운로드</button><button class="main" id="btnImgSave">📤 공유/사진 저장</button></div></div></div><div class="toast" id="toast"></div>
<script>
const K_INV='gr_inv_v2',K_LOG='gr_log_v2',K_TH='gr_th_v2',BASE_DATE='2026.08.11';
const DEFAULT_DATA=[
 {cat:'가드레일',items:[{name:'2W * 3.2T',qty:188},{name:'2W * 4.0T',qty:57},{name:'2W * 4.0T (19홀)',qty:0},{name:'3W (28홀)',qty:44},{name:'3W (30홀)',qty:34},{name:'3W (32홀)',qty:24},{name:'3W (36홀)',qty:43},{name:'개방형 은색',qty:220},{name:'개방형 풀색',qty:74}]},
 {cat:'차광망',items:[{name:'각형',qty:27},{name:'원형',qty:30}]},
 {cat:'파이프',items:[{name:'P-POST (1홀)',qty:103},{name:'P-POST (2홀)',qty:109},{name:'P-POST 2홀(개방형) 350 넓은것',qty:94},{name:'A-POST 1홀 700',qty:68},{name:'A-POST 1홀 700 (200*240)',qty:0},{name:'A-POST 2홀 800',qty:59},{name:'A-POST 2홀 (개방형) 840',qty:80}]},

];
let inv=null,log=[],th={red:20,orange:50},openCats={},lastImgURL=null;
function gs(k){try{const value=localStorage.getItem(k);return value?JSON.parse(value):null}catch(e){return null}}
function ss(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('저장 공간을 사용할 수 없습니다')}}
function boot(){inv=gs(K_INV)||JSON.parse(JSON.stringify(DEFAULT_DATA));log=gs(K_LOG)||[];th=gs(K_TH)||{red:20,orange:50};inv.forEach(c=>{if(openCats[c.cat]===undefined)openCats[c.cat]=true});document.getElementById('thRed').value=th.red;document.getElementById('thOrange').value=th.orange;render()}
function lvl(q){return q<th.red?'red':q<th.orange?'orange':'green'}function lvlText(l){return l==='red'?'부족':l==='orange'?'주의':'충분'}function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}function toast(m,ms=1700){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),ms)}
let deferredInstallPrompt=null;const installBtn=document.getElementById('btnInstall');const standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;if(!standalone)installBtn.hidden=false;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;installBtn.hidden=false});installBtn.onclick=async()=>{if(deferredInstallPrompt){deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;return}if(/iphone|ipad|ipod/i.test(navigator.userAgent))toast('Safari 공유 버튼 → 홈 화면에 추가를 선택하세요',5000);else toast('브라우저 메뉴 → 앱 설치 또는 홈 화면에 추가를 선택하세요',5000)};window.addEventListener('appinstalled',()=>{installBtn.hidden=true;toast('홈 화면에 설치되었습니다')});
document.querySelectorAll('.tabs button').forEach(b=>{b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));document.getElementById('page-'+b.dataset.page).classList.add('on');window.scrollTo(0,0)}});document.getElementById('btnGoIO').onclick=()=>document.querySelector('.tabs button[data-page="io"]').click();
function renderStock(){let t=0,r=0,o=0,g=0;document.getElementById('stockList').innerHTML=inv.map((c,ci)=>{const rows=c.items.map((it,ii)=>{t++;const l=lvl(it.qty);if(l==='red')r++;else if(l==='orange')o++;else g++;return `<div class="row"><div class="rowtop"><div class="itemname">${esc(it.name)}${it.note?`<div class="note">${esc(it.note)}</div>`:''}</div><span class="pill ${l}">${lvlText(l)}</span></div><div class="stepper"><button class="pm minus" onclick="bump(${ci},${ii},-1)">−</button><input class="qty" type="number" inputmode="numeric" value="${it.qty}" onchange="setQty(${ci},${ii},this.value)" onfocus="this.select()"><button class="pm plus" onclick="bump(${ci},${ii},1)">＋</button></div><div class="rowtools"><button onclick="renameItem(${ci},${ii})">이름 수정</button><button onclick="delItem(${ci},${ii})">품목 삭제</button></div><div class="noteedit"><input type="text" maxlength="50" value="${esc(it.note||'')}" placeholder="비고 입력 (이미지에도 표시)" onfocus="this.select()"><button onclick="setNote(${ci},${ii},this.previousElementSibling.value)">비고 저장</button></div></div>`}).join('');return `<div class="cat ${openCats[c.cat]?'open':''}"><button class="cathead" data-cat-index="${ci}"><span class="left"><span class="badge">${c.items.length}</span><span class="nm">${esc(c.cat)}</span></span><span class="arw">▼</span></button><div class="catbody">${rows||'<div class="row"><div class="note">등록된 품목이 없습니다. 품목편집 탭에서 추가해 주세요.</div></div>'}</div></div>`}).join('');document.querySelectorAll('.cathead').forEach(b=>b.onclick=()=>toggleCat(inv[Number(b.dataset.catIndex)].cat));document.getElementById('sTotal').textContent=t;document.getElementById('sRed').textContent=r;document.getElementById('sOrange').textContent=o;document.getElementById('sGreen').textContent=g}
function toggleCat(name){openCats[name]=!openCats[name];renderStock()}function bump(ci,ii,d){const it=inv[ci].items[ii];if(it.qty+d<0){toast('0보다 작아질 수 없습니다');return}it.qty+=d;ss(K_INV,inv);renderStock();refreshSelectors()}function setQty(ci,ii,v){let n=parseInt(v,10);if(isNaN(n)||n<0)n=0;inv[ci].items[ii].qty=n;ss(K_INV,inv);renderStock();refreshSelectors();toast('수량이 저장되었습니다')}function setNote(ci,ii,v){const note=String(v).trim();if(note)inv[ci].items[ii].note=note;else delete inv[ci].items[ii].note;ss(K_INV,inv);renderStock();toast(note?'비고가 저장되었습니다':'비고가 삭제되었습니다')}function renameItem(ci,ii){const nn=prompt('품목명을 수정해 주세요',inv[ci].items[ii].name);if(nn===null||!nn.trim())return;inv[ci].items[ii].name=nn.trim();ss(K_INV,inv);renderStock();refreshSelectors();toast('이름이 수정되었습니다')}function delItem(ci,ii){if(!confirm(`"${inv[ci].items[ii].name}" 품목을 삭제하시겠습니까?`))return;inv[ci].items.splice(ii,1);ss(K_INV,inv);renderStock();refreshSelectors();toast('삭제되었습니다')}
let mode='in';document.getElementById('btnIn').onclick=()=>{mode='in';document.getElementById('btnIn').className='on in';document.getElementById('btnOut').className=''};document.getElementById('btnOut').onclick=()=>{mode='out';document.getElementById('btnOut').className='on out';document.getElementById('btnIn').className=''};
function refreshSelectors(){const keep=document.getElementById('selCat').value;const opts=inv.map((c,i)=>`<option value="${i}">${esc(c.cat)}</option>`).join('');document.getElementById('selCat').innerHTML=opts;document.getElementById('addCat').innerHTML=opts;if(keep!==''&&inv[Number(keep)])document.getElementById('selCat').value=keep;fillItems()}function fillItems(){const c=inv[Number(document.getElementById('selCat').value)];document.getElementById('selItem').innerHTML=c&&c.items.length?c.items.map((i,n)=>`<option value="${n}">${esc(i.name)} — 현재 ${i.qty}</option>`).join(''):'<option value="">품목 없음</option>'}document.getElementById('selCat').onchange=fillItems;
document.getElementById('btnSubmit').onclick=()=>{const ci=Number(document.getElementById('selCat').value),ii=Number(document.getElementById('selItem').value),q=parseInt(document.getElementById('inpQty').value,10),note=document.getElementById('inpNote').value.trim(),c=inv[ci],it=c&&c.items[ii];if(!it){toast('품목을 선택해 주세요');return}if(!q||q<=0){toast('수량을 입력해 주세요');return}if(mode==='out'&&it.qty-q<0){toast(`재고가 부족합니다 (현재 ${it.qty})`);return}it.qty+=mode==='in'?q:-q;if(note)it.note=note;log.unshift({id:Date.now(),ts:new Date().toISOString(),cat:c.cat,name:it.name,mode,qty:q,note});ss(K_INV,inv);ss(K_LOG,log);document.getElementById('inpQty').value='';document.getElementById('inpNote').value='';render();toast(mode==='in'?'입고 기록이 완료되었습니다':'출고 기록이 완료되었습니다')};
function fmt(iso){const d=new Date(iso),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`}function renderLog(){const el=document.getElementById('logList');if(!log.length){el.innerHTML='<div class="empty">아직 입출고 기록이 없습니다.<br>입출고 탭에서 기록해 주세요.</div>';return}el.innerHTML=log.slice(0,80).map(l=>`<div class="log"><div><div class="t1">${esc(l.cat)} · ${esc(l.name)}</div><div class="t2">${fmt(l.ts)}${l.note?' · '+esc(l.note):''}</div></div><div style="display:flex;align-items:center;gap:10px"><div class="amt ${l.mode}">${l.mode==='in'?'+':'−'}${l.qty}</div><button class="undo" onclick="undo(${l.id})">취소</button></div></div>`).join('')}function undo(id){const e=log.find(x=>x.id===id);if(!e)return;const c=inv.find(x=>x.cat===e.cat),it=c&&c.items.find(i=>i.name===e.name);if(it){const next=it.qty+(e.mode==='in'?-e.qty:e.qty);if(next<0){toast('현재 재고가 부족해 취소할 수 없습니다');return}it.qty=next}log=log.filter(x=>x.id!==id);ss(K_INV,inv);ss(K_LOG,log);render();toast('기록이 취소되었습니다')}
document.getElementById('btnAddItem').onclick=()=>{const c=inv[Number(document.getElementById('addCat').value)],nm=document.getElementById('addName').value.trim(),q=Math.max(0,parseInt(document.getElementById('addQty').value,10)||0);if(!c){toast('분류를 먼저 추가해 주세요');return}if(!nm){toast('품목명을 입력해 주세요');return}if(c.items.some(i=>i.name===nm)){toast('같은 이름의 품목이 이미 있습니다');return}c.items.push({name:nm,qty:q});openCats[c.cat]=true;ss(K_INV,inv);document.getElementById('addName').value='';document.getElementById('addQty').value='';render();toast('품목이 추가되었습니다')};document.getElementById('btnAddCat').onclick=()=>{const nm=document.getElementById('addCatName').value.trim();if(!nm){toast('분류명을 입력해 주세요');return}if(inv.some(c=>c.cat===nm)){toast('이미 있는 분류입니다');return}inv.push({cat:nm,items:[]});openCats[nm]=true;ss(K_INV,inv);document.getElementById('addCatName').value='';render();toast('분류가 추가되었습니다')};document.getElementById('btnSaveTh').onclick=()=>{const r=parseInt(document.getElementById('thRed').value,10),o=parseInt(document.getElementById('thOrange').value,10);if(isNaN(r)||isNaN(o)||r<0||o<=r){toast('주의 기준은 부족 기준보다 커야 합니다');return}th={red:r,orange:o};ss(K_TH,th);render();toast('기준이 저장되었습니다')};document.getElementById('btnReset').onclick=()=>{if(!confirm('8월 11일 기준 재고로 되돌리시겠습니까? 추가하신 품목은 삭제됩니다.'))return;inv=JSON.parse(JSON.stringify(DEFAULT_DATA));openCats={};inv.forEach(c=>openCats[c.cat]=true);ss(K_INV,inv);render();toast('초기값으로 복원되었습니다')};
document.getElementById('btnExcel').onclick=()=>{if(typeof XLSX==='undefined'){toast('엑셀 기능을 불러오지 못했습니다');return}const wb=XLSX.utils.book_new(),a=[['품목','수량','상태','비고']];inv.forEach(c=>{a.push([c.cat,'','','']);c.items.forEach(i=>a.push(['   '+i.name,i.qty,lvlText(lvl(i.qty)),i.note||'']))});const w1=XLSX.utils.aoa_to_sheet(a);w1['!cols']=[{wch:34},{wch:10},{wch:8},{wch:20}];XLSX.utils.book_append_sheet(wb,w1,'재고현황');const b=[['일시','분류','품목','구분','수량','비고']];log.forEach(l=>b.push([fmt(l.ts),l.cat,l.name,l.mode==='in'?'입고':'출고',l.qty,l.note||'']));const w2=XLSX.utils.aoa_to_sheet(b);w2['!cols']=[{wch:18},{wch:12},{wch:30},{wch:8},{wch:8},{wch:20}];XLSX.utils.book_append_sheet(wb,w2,'입출고기록');XLSX.writeFile(wb,`재고현황_${stamp()}.xlsx`);toast('엑셀 파일이 저장되었습니다')};function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`}
function buildImage(){const S=2,PAD=40,CW=[190,470,170,210],TW=CW.reduce((a,b)=>a+b,0),RH=44,HH=56,TITLE=110;let rows=0;inv.forEach(c=>rows+=Math.max(c.items.length,1));const W=TW+PAD*2,H=TITLE+HH+RH*rows+PAD+30,cv=document.createElement('canvas');cv.width=W*S;cv.height=H*S;const x=cv.getContext('2d');x.scale(S,S);x.fillStyle='#fff';x.fillRect(0,0,W,H);x.textBaseline='middle';const d=new Date(),p=n=>String(n).padStart(2,'0');x.fillStyle='#333';x.font='16px "Noto Sans KR",sans-serif';x.textAlign='right';x.fillText(`${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())}`,W-PAD,40);x.fillStyle='#000';x.font='700 30px "Noto Sans KR",sans-serif';x.textAlign='center';x.fillText('재 고 현 황',W/2,74);x.strokeStyle='#000';x.lineWidth=1.5;const tw=x.measureText('재 고 현 황').width;x.beginPath();x.moveTo(W/2-tw/2,92);x.lineTo(W/2+tw/2,92);x.stroke();const L=PAD,T=TITLE,cx=[L,L+CW[0],L+CW[0]+CW[1],L+CW[0]+CW[1]+CW[2],L+TW];x.lineWidth=1.6;x.strokeRect(L,T,TW,HH);x.font='700 20px "Noto Sans KR",sans-serif';x.fillText('품    목',(cx[0]+cx[2])/2,T+HH/2);x.fillText('수    량',(cx[2]+cx[3])/2,T+HH/2);x.fillText('비    고',(cx[3]+cx[4])/2,T+HH/2);[cx[2],cx[3]].forEach(v=>{x.beginPath();x.moveTo(v,T);x.lineTo(v,T+HH);x.stroke()});let y=T+HH;inv.forEach(c=>{const n=Math.max(c.items.length,1),blockH=RH*n;x.lineWidth=1.6;x.strokeRect(L,y,CW[0],blockH);x.fillStyle='#d40000';x.font='700 18px "Noto Sans KR",sans-serif';x.textAlign='center';wrapText(x,c.cat,L+CW[0]/2,y+blockH/2,CW[0]-16,22);if(!c.items.length){x.strokeRect(cx[1],y,CW[1],RH);x.strokeRect(cx[2],y,CW[2],RH);x.strokeRect(cx[3],y,CW[3],RH);y+=RH}else{c.items.forEach(it=>{x.lineWidth=1;x.strokeStyle='#000';x.strokeRect(cx[1],y,CW[1],RH);x.strokeRect(cx[2],y,CW[2],RH);x.strokeRect(cx[3],y,CW[3],RH);x.fillStyle='#000';x.font='17px "Noto Sans KR",sans-serif';x.fillText(fit(x,it.name,CW[1]-14),cx[1]+CW[1]/2,y+RH/2);x.font='600 18px "JetBrains Mono",monospace';x.fillText(String(it.qty),cx[2]+CW[2]/2,y+RH/2);if(it.note){x.font='14px "Noto Sans KR",sans-serif';x.fillStyle='#555';x.fillText(fit(x,it.note,CW[3]-14),cx[3]+CW[3]/2,y+RH/2)}y+=RH});x.lineWidth=1.6;x.strokeRect(L,y-blockH,CW[0],blockH)}});x.lineWidth=1.8;x.strokeRect(L,T,TW,HH+y-T-HH);x.fillStyle='#888';x.font='13px "Noto Sans KR",sans-serif';x.textAlign='right';x.fillText('재고관리 앱에서 생성',W-PAD,y+22);return cv}function fit(ctx,txt,max){if(ctx.measureText(txt).width<=max)return txt;let s=txt;while(s.length>1&&ctx.measureText(s+'…').width>max)s=s.slice(0,-1);return s+'…'}function wrapText(ctx,txt,cx,cy,max,lh){if(ctx.measureText(txt).width<=max){ctx.fillText(txt,cx,cy);return}const mid=Math.ceil(txt.length/2);ctx.fillText(txt.slice(0,mid),cx,cy-lh/2);ctx.fillText(txt.slice(mid),cx,cy+lh/2)}
document.getElementById('btnImage').onclick=()=>{try{const cv=buildImage();lastImgURL=cv.toDataURL('image/png');document.getElementById('imgPreview').src=lastImgURL;document.getElementById('imgModal').classList.add('on')}catch(e){toast('이미지를 만들지 못했습니다')}};document.getElementById('btnImgClose').onclick=()=>document.getElementById('imgModal').classList.remove('on');document.getElementById('imgModal').onclick=e=>{if(e.target.id==='imgModal')e.currentTarget.classList.remove('on')};document.getElementById('btnImgSave').onclick=()=>{if(!lastImgURL)return;const a=document.createElement('a');a.href=lastImgURL;a.download=`재고현황_${stamp()}.png`;document.body.appendChild(a);a.click();a.remove();toast('이미지가 저장되었습니다')};
